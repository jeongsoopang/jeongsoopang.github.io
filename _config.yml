# -------------------------------------------------------------------
# Site
# -------------------------------------------------------------------
lang: en
locale: en-US
title: "Jeongsoo's Blog"
description: "Robotics / UAV / AI notes, projects, and life logs."
url: "https://jeongsoopang.github.io"
baseurl: ""   # keep empty for <username>.github.io

# -------------------------------------------------------------------
# Theme (USE GEM THEME, NOT remote_theme)
# -------------------------------------------------------------------
theme: minimal-mistakes-jekyll
minimal_mistakes_skin: "default"

# -------------------------------------------------------------------
# Build settings
# -------------------------------------------------------------------
markdown: kramdown
permalink: /:categories/:title/
paginate: 5
paginate_path: /page:num/

# ✅ Math support (Kramdown + MathJax)
kramdown:
  math_engine: mathjax
  input: GFM
  hard_wrap: false
  auto_ids: true
  syntax_highlighter_opts:
    block:
      line_numbers: false

# ✅ Minimal Mistakes: enable MathJax loading
mathjax: true

# -------------------------------------------------------------------
# Plugins
# -------------------------------------------------------------------
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-include-cache

# -------------------------------------------------------------------
# Author (left profile card)
# -------------------------------------------------------------------
author:
  name: "Jeongsoo Pang"
  avatar: "/assets/images/profile.jpg"
  bio: "AI / Robotics / UAV"
  location: "Shanghai - Korea"
  links:
    - label: "Blog's Home"
      icon: "fas fa-fw fa-home"
      url: "/"
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/jeongsoopang"
    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://www.linkedin.com/in/jeongsoo-pang/"
    - label: "Email"
      icon: "fas fa-fw fa-envelope"
      url: "mailto:jeongsoopang@gmail.com"

# -------------------------------------------------------------------
# Defaults
# -------------------------------------------------------------------
defaults:
  # Posts
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      classes: wide
      author_profile: true
      sidebar:
        nav: "sidebar"
      read_time: true
      comments: false
      share: false
      related: true

  # Pages
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true

# -------------------------------------------------------------------
# Pages collection
# -------------------------------------------------------------------
collections:
  pages:
    output: true

include:
  - _pages

# -------------------------------------------------------------------
# Exclude from build
️
# -------------------------------------------------------------------
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
